<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اولین صدای قلب تو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f2ed;color:#5b514b;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fffdfb;border:1px solid #d5b07a;border-radius:28px;padding:28px;box-shadow:0 12px 40px #5a3c1e14}
h1{text-align:center;color:#a97938;font-size:34px;margin:4px 0 8px}.subtitle{text-align:center;margin-bottom:24px}
.photo{width:100%;border-radius:22px;display:block;max-height:600px;object-fit:cover;border:1px solid #ead8bd}
.audio{margin:24px 0;padding:18px;border:1px solid #ead8bd;border-radius:18px;background:#fff8f1}
.play-title{text-align:center;color:#a97938;font-weight:bold;margin-bottom:12px}audio{width:100%}
.quote{text-align:center;font-size:18px;line-height:2;margin:24px 0;color:#7a6a5e}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border-top:1px solid #ead8bd;padding-top:12px;text-align:center}
.label{font-size:13px;color:#9b8b7e}.value{font-weight:bold;color:#6d5a4a;margin-top:5px}
.heart{text-align:center;color:#b8894b;font-size:28px;margin:4px}
@media(max-width:600px){h1{font-size:28px}.details{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><main class="card">
<div class="heart">♡</div><h1>اولین صدای قلب تو</h1><div class="subtitle">یک خاطره برای تمام عمر</div>
<img class="photo" src="ultrasound.jpg" alt="اولین تصویر سونوگرافی">
<section class="audio"><div class="play-title">♡ صدای اولین ضربان قلبت ♡</div>
<audio controls preload="metadata"><source src="heartbeat.mp3" type="audio/mpeg"></audio></section>
<div class="quote">«از همان لحظه‌ای که صدای قلبت را شنیدیم، دنیای ما برای همیشه زیباتر شد.»</div>
<section class="details">
<div class="item"><div class="label">هفته بارداری</div><div class="value">هفته ۸</div></div>
<div class="item"><div class="label">تاریخ</div><div class="value">۱۴۰۵/۰۴/۲۲</div></div>
<div class="item"><div class="label">یادگار</div><div class="value">اولین ضربان قلبت</div></div>
</section></main></div></body></html>
